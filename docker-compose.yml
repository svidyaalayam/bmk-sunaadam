services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carnatic}
      POSTGRES_USER: ${POSTGRES_USER:-carnatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carnatic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carnatic} -d ${POSTGRES_DB:-carnatic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_ADMIN_USERNAME: ${DJANGO_ADMIN_USERNAME:-admin}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-admin}
      DJANGO_ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL:-admin@example.com}
      POSTGRES_DB: ${POSTGRES_DB:-carnatic}
      POSTGRES_USER: ${POSTGRES_USER:-carnatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carnatic}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: .
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
